name: Copy signing key (one-time)

# Run by hand once: copies this repo's CRX signing key to the releases repo, GitHub to GitHub.
# The key is never printed. This file is removed straight after.
on: workflow_dispatch

permissions: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the secret
        env:
          KEY: ${{ secrets.CRX_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.XFER_TOKEN }}
        run: |
          if [ -z "$KEY" ] || [ -z "$GH_TOKEN" ]; then echo "::error::a secret is missing"; exit 1; fi
          printf '%s' "$KEY" | gh secret set CRX_PRIVATE_KEY -R arizona-roofers/dollars-and-callers
          echo "copied"
